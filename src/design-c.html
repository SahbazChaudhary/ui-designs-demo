<title>C&amp;G Soft Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Option C · Soft cards: floating icon rail with fly-out menus, lavender-grey ground, borderless rounded cards, filled inputs, pill buttons. Phone: bottom tab bar + bottom sheet. */
:root {
  --bg: #F1EFF3; --surface: #FFFFFF; --surface-2: #F5F3F6; --header-bg: rgba(241,239,243,.86);
  --fg: #1E1A21; --label: #3B3540; --muted: #716A76; --line: #EAE6EC; --line-strong: #D2CBD5;
  --accent: #D93380; --accent-hover: #C22470; --accent-text: #C22470; --accent-ink: #FFFFFF; --accent-soft: rgba(227,58,135,.11);
  --danger: #C62F2F; --danger-soft: #FCEBEB; --warn-soft: #FFF2D4; --warn-ink: #8A5A00; --focus: #E33A87;
  --field-bg: #F5F3F6; --row-hover: #FAF8FA; --th-bg: transparent; --toast-bg: #1E1A21; --toast-fg: #FFFFFF;
  --shadow: 0 1px 2px rgba(40,20,40,.04), 0 10px 30px rgba(40,20,40,.05); --shadow-color: rgba(40,20,40,.16); --scrim: rgba(30,20,34,.28);
  --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Consolas, monospace;
  --radius: 20px; --radius-sm: 12px; --field-radius: 12px; --btn-radius: 999px; --panel-border: 0;
  --gutter: 28px; --sticky-top: 96px; --h1-weight: 500; --h1-track: -0.015em; --rail-w: 84px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121014; --surface: #1C191F; --surface-2: #26222A; --header-bg: rgba(18,16,20,.86);
  --fg: #F1EDF3; --label: #D5CED9; --muted: #A49CA9; --line: #2E2933; --line-strong: #463F4C;
  --accent: #E0408A; --accent-hover: #EC5A9C; --accent-text: #F27AB2; --accent-ink: #FFFFFF; --accent-soft: rgba(236,76,149,.17);
  --danger: #F07A7A; --danger-soft: rgba(240,112,112,.14); --warn-soft: rgba(255,190,60,.15); --warn-ink: #F3C35A; --focus: #F27AB2;
  --field-bg: #252128; --row-hover: #221E25; --toast-bg: #F1EDF3; --toast-fg: #1C191F;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset; --shadow-color: rgba(0,0,0,.55); --scrim: rgba(0,0,0,.5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121014; --surface: #1C191F; --surface-2: #26222A; --header-bg: rgba(18,16,20,.86);
  --fg: #F1EDF3; --label: #D5CED9; --muted: #A49CA9; --line: #2E2933; --line-strong: #463F4C;
  --accent: #E0408A; --accent-hover: #EC5A9C; --accent-text: #F27AB2; --accent-ink: #FFFFFF; --accent-soft: rgba(236,76,149,.17);
  --danger: #F07A7A; --danger-soft: rgba(240,112,112,.14); --warn-soft: rgba(255,190,60,.15); --warn-ink: #F3C35A; --focus: #F27AB2;
  --field-bg: #252128; --row-hover: #221E25; --toast-bg: #F1EDF3; --toast-fg: #1C191F;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset; --shadow-color: rgba(0,0,0,.55); --scrim: rgba(0,0,0,.5); color-scheme: dark;
}
{{BASE_CSS}}

/* ---------- Option C chrome ---------- */
.rail { position: fixed; z-index: 40; top: 12px; bottom: 12px; left: 12px; width: var(--rail-w); padding: 14px 8px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: stretch; gap: 4px; overflow-y: auto; }
.rail .mark { display: grid; place-items: center; padding: 4px 0 14px; }
.rail .mark img { width: 34px; height: 34px; }
.rail-btn { width: 100%; display: grid; justify-items: center; gap: 3px; padding: 9px 4px 7px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); cursor: pointer; }
.rail-btn em { font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: .01em; }
.rail-btn .i { width: 21px; height: 21px; }
.rail-btn:hover { background: var(--surface-2); color: var(--fg); }
.rail-item.has-active > .rail-btn { color: var(--accent-text); background: var(--accent-soft); }
.rail-btn.active-panel { color: var(--fg); background: var(--surface-2); }
.flyout { position: fixed; z-index: 45; top: 12px; bottom: 12px; left: calc(var(--rail-w) + 24px); width: 268px; padding: 20px 14px; background: var(--surface); border-radius: 24px; box-shadow: 0 18px 50px var(--shadow-color); overflow-y: auto; opacity: 0; visibility: hidden; transform: translateX(-8px); transition: opacity .18s, transform .18s, visibility .18s; }
.flyout.open { opacity: 1; visibility: visible; transform: none; }
.fly-title { margin: 0 10px 12px; font-family: var(--font-display); font-size: 20px; font-weight: 500; }
.fly-links { display: grid; gap: 2px; }
.flyout:has(.two-col) { width: 460px; }
.fly-links.two-col { grid-template-columns: 1fr 1fr; }
.nav-link { display: block; padding: 9px 12px; border-radius: 12px; color: var(--label); text-decoration: none; font-size: 14px; }
.nav-link:hover { background: var(--surface-2); color: var(--fg); }
.nav-link.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.scrim { display: none; }
body.panel-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: var(--scrim); }

.main { margin-left: calc(var(--rail-w) + 12px); min-width: 0; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.topbar-in { max-width: var(--content-max, 1360px); margin-inline: auto; padding: 14px var(--gutter); display: flex; align-items: center; gap: 14px; }
.topbar img { width: 150px; height: auto; display: block; }
.topbar .search { flex: 0 1 400px; margin-left: auto; border: 0; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.top-right { display: flex; align-items: center; gap: 6px; }
.top-right .icon-btn { border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #E33A87, #9C6BB0); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 13px; }

/* C: soft components */
.content { padding-block: 8px 96px; }
.page-head h1 { font-size: clamp(1.6rem, 1.3rem + 1.2vw, 2.15rem); }
.toolbar { border-bottom: 0; padding: 18px 20px 6px; }
.data th { border-bottom: 0; padding-top: 12px; }
.data td { border-bottom-color: var(--line); }
.data tbody tr td:first-child { border-radius: 12px 0 0 12px; }
.data tbody tr td:last-child { border-radius: 0 12px 12px 0; }
.table-wrap { padding: 0 8px 8px; }
.data td, .data th { padding-inline: 14px; }
.pager { border-top: 0; padding: 4px 20px 18px; }
.form-section { padding: 24px 22px; }
.form-section + .form-section { border-top: 0; padding-top: 4px; }
.section-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 18px; }
.field input, .field select, .field textarea, .affix, .search, .cell-input { border-color: transparent; }
.affix > span { background: transparent; }
.form-actions { border-top: 0; padding: 16px 22px 22px; }
.btn-ghost { background: var(--surface-2); border-color: transparent; }
.btn-ghost:hover { background: var(--line); border-color: transparent; }
.meta-chip { border: 0; border-radius: 999px; box-shadow: var(--shadow); }
.summary { padding: 22px; }
.code { background: var(--accent-soft); color: var(--accent-text); }

@media (max-width: 1023px) { .topbar .search { display: none; } .top-right { margin-left: auto; } }
@media (max-width: 899px) {
  :root { --gutter: 16px; --sticky-top: 76px; }
  .rail { top: auto; left: 0; right: 0; bottom: 0; width: auto; flex-direction: row; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px var(--shadow-color); overflow-x: auto; overflow-y: hidden; }
  .rail .mark { display: none; }
  .rail-item { flex: 1 0 64px; }
  .rail-btn { padding: 7px 2px 5px; }
  .flyout { top: auto; left: 8px; right: 8px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 62vh; transform: translateY(12px); border-radius: 22px; }
  .flyout:has(.two-col) { width: auto; }
  .main { margin-left: 0; }
  .topbar-in { padding-block: 10px; }
  .topbar img { width: 124px; }
  .content { padding-bottom: 150px; }
  .so-side { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .form-actions { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 420px) { .fly-links.two-col { grid-template-columns: 1fr; } .bell { display: none; } }
</style>

{{SPRITE}}

<nav class="rail" aria-label="Main menu">
  <div class="mark"><img src="{{MARK}}" alt="Chillies &amp; Garlic" width="34" height="34"></div>
{{NAV}}
</nav>
<div class="scrim" data-scrim></div>

<div class="main">
  <header class="topbar">
    <div class="topbar-in">
      <img src="{{LOGO}}" alt="Chillies &amp; Garlic commission company" width="150" height="41">
      <label class="search" for="globalSearch">
        <svg class="i" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <input id="globalSearch" type="search" placeholder="Search buyers, suppliers, lots…" autocomplete="off">
      </label>
      <div class="top-right">
        <span class="option-badge"><b>C</b><span>Option C · Soft Cards</span></span>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch light or dark mode" title="Light / dark"><svg class="i" viewBox="0 0 24 24"><use href="#i-moon"/></svg></button>
        <button class="icon-btn bell" type="button" data-demo-off aria-label="Notifications" title="Notifications"><span class="sr">Notifications</span><svg class="i" viewBox="0 0 24 24"><use href="#i-bell"/></svg></button>
        <span class="avatar" title="Admin">AD</span>
      </div>
    </div>
  </header>

  <main class="content">
{{SCREENS}}
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

{{COMMON_JS}}
</script>
