<title>C&amp;G Top Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Option B · Top navigation: two-tier white header with dropdown menus, full-width content, crisp 6px corners, dense tables. */
:root {
  --bg: #FAFAFB; --surface: #FFFFFF; --surface-2: #F4F4F6; --header-bg: #FFFFFF;
  --fg: #18171B; --label: #34333A; --muted: #6B6A72; --line: #E6E5EA; --line-strong: #C9C8D0;
  --accent: #D93380; --accent-hover: #C22470; --accent-text: #C22470; --accent-ink: #FFFFFF; --accent-soft: rgba(227,58,135,.10);
  --danger: #C62F2F; --danger-soft: #FCEBEB; --warn-soft: #FFF2D4; --warn-ink: #8A5A00; --focus: #E33A87;
  --field-bg: #FFFFFF; --row-hover: #FAF7F9; --th-bg: #F7F7F9; --toast-bg: #18171B; --toast-fg: #FFFFFF;
  --shadow: none; --shadow-color: rgba(24,23,27,.14); --scrim: rgba(18,16,20,.42); --drop-shadow: 0 12px 32px rgba(24,23,27,.12);
  --font-display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --radius: 6px; --radius-sm: 6px; --gutter: 32px; --content-max: 1600px; --sticky-top: 132px; --h1-weight: 800; --h1-track: -0.025em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111013; --surface: #18171B; --surface-2: #222126; --header-bg: #18171B;
  --fg: #EFEEF2; --label: #D3D2D9; --muted: #9D9BA6; --line: #2A2930; --line-strong: #434149;
  --accent: #E0408A; --accent-hover: #EC5A9C; --accent-text: #F27AB2; --accent-ink: #FFFFFF; --accent-soft: rgba(236,76,149,.16);
  --danger: #F07A7A; --danger-soft: rgba(240,112,112,.14); --warn-soft: rgba(255,190,60,.15); --warn-ink: #F3C35A; --focus: #F27AB2;
  --field-bg: #141316; --row-hover: #1F1E23; --th-bg: #1D1C21; --toast-bg: #EFEEF2; --toast-fg: #18171B;
  --shadow-color: rgba(0,0,0,.55); --scrim: rgba(0,0,0,.6); --drop-shadow: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111013; --surface: #18171B; --surface-2: #222126; --header-bg: #18171B;
  --fg: #EFEEF2; --label: #D3D2D9; --muted: #9D9BA6; --line: #2A2930; --line-strong: #434149;
  --accent: #E0408A; --accent-hover: #EC5A9C; --accent-text: #F27AB2; --accent-ink: #FFFFFF; --accent-soft: rgba(236,76,149,.16);
  --danger: #F07A7A; --danger-soft: rgba(240,112,112,.14); --warn-soft: rgba(255,190,60,.15); --warn-ink: #F3C35A; --focus: #F27AB2;
  --field-bg: #141316; --row-hover: #1F1E23; --th-bg: #1D1C21; --toast-bg: #EFEEF2; --toast-fg: #18171B;
  --shadow-color: rgba(0,0,0,.55); --scrim: rgba(0,0,0,.6); --drop-shadow: 0 12px 32px rgba(0,0,0,.5); color-scheme: dark;
}
{{BASE_CSS}}

/* ---------- Option B chrome ---------- */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--header-bg); border-bottom: 1px solid var(--line); }
.header-row { max-width: var(--content-max); margin-inline: auto; padding-inline: var(--gutter); display: flex; align-items: center; gap: 20px; }
.row-1 { height: 66px; }
.row-1 img { width: 158px; height: auto; display: block; }
.row-1 .search { flex: 0 1 460px; margin-inline: auto; }
.top-right { display: flex; align-items: center; gap: 6px; }
.avatar { display: flex; align-items: center; gap: 10px; padding-left: 12px; margin-left: 6px; border-left: 1px solid var(--line); font-size: 13px; }
.avatar b { width: 32px; height: 32px; border-radius: 6px; background: var(--fg); color: var(--surface); display: grid; place-items: center; font-size: 12px; }
.avatar small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.2; }
.row-2 { height: 46px; gap: 4px; }
.mainnav { display: flex; align-items: stretch; gap: 2px; height: 100%; }
.nav-top { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 14px; color: var(--label); font-weight: 600; font-size: 13.5px; text-decoration: none; cursor: pointer; list-style: none; position: relative; white-space: nowrap; }
.nav-top::-webkit-details-marker { display: none; }
.nav-top:hover { color: var(--fg); }
.nav-top .chev { width: 15px; height: 15px; color: var(--muted); transition: transform .2s; }
details.menu { position: relative; }
details.menu[open] > .nav-top .chev { transform: rotate(180deg); }
details.menu.has-active > .nav-top { color: var(--accent-text); }
details.menu.has-active > .nav-top::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.dropdown { position: absolute; top: calc(100% + 1px); left: 0; min-width: 230px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--drop-shadow); display: grid; gap: 1px; }
.dropdown.wide { grid-template-columns: repeat(2, minmax(200px, 1fr)); min-width: 460px; }
.nav-link { display: block; padding: 8px 12px; border-radius: 5px; color: var(--label); text-decoration: none; font-size: 13.5px; }
.nav-link:hover { background: var(--surface-2); color: var(--fg); }
.nav-link.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 700; }
.fy { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.fy b { color: var(--label); }
.menu-btn, .drawer-head { display: none; }
details.menu:nth-last-of-type(-n+2) .dropdown { left: auto; right: 0; }
.scrim { display: none; }

/* B: denser, flatter components */
.content { padding-block: 24px 96px; }
.page-head { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.data td { padding: 10px 16px; }
.btn { min-height: 38px; }
.tag { border-radius: 4px; }

@media (max-width: 1099px) { .avatar span { display: none; } .avatar { border: 0; padding-left: 0; } .fy { display: none; } }
@media (max-width: 899px) {
  :root { --gutter: 16px; --sticky-top: 84px; }
  .row-1 { height: 60px; gap: 10px; }
  .row-1 img { width: 128px; }
  .row-1 .search { display: none; }
  .top-right { margin-left: auto; }
  .menu-btn { display: inline-grid; }
  .row-2 { position: fixed; top: 0; bottom: 0; right: 0; width: min(320px, 88vw); height: auto; padding: env(safe-area-inset-top, 0px) 0 20px; background: var(--surface); transform: translateX(102%); transition: transform .25s ease; box-shadow: -8px 0 30px var(--shadow-color); flex-direction: column; align-items: stretch; overflow-y: auto; z-index: 50; }
  body.nav-open .row-2 { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 25; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .mainnav { flex-direction: column; height: auto; padding: 8px; }
  .nav-top { height: 46px; padding: 0 12px; border-radius: 6px; }
  .nav-top .chev { margin-left: auto; }
  details.menu.has-active > .nav-top::after { left: 0; right: auto; top: 12px; bottom: 12px; width: 3px; height: auto; }
  .dropdown, .dropdown.wide { position: static; min-width: 0; border: 0; box-shadow: none; padding: 0 0 8px 12px; grid-template-columns: 1fr; }
  .fy { display: block; margin: 12px 20px 0; }
}
@media (max-width: 480px) { .bell { display: none; } }
</style>

{{SPRITE}}
